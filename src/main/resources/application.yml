engine:
  channels:
    #requests: engine.requests
    #replies: engine.replies
    requests: message-log
    replies: message-log-res
  items:
    cache-ttl-seconds: 300
    unknown-user-ttl-seconds: 60
    # number of item sprites in the Unity client (ItemManager.sprites in the MainMenu scene);
    # generated items get a graphics id in [0, graphics-count)
    # the 181 sprites of the sheet, then 16 skins for each of the 9 kinds of equipment (ItemArt.cs in the client)
    graphics-count: 325
    # how many item ids are reserved at once from the database sequence (items_id_seq): generated items get their
    # final id right away; the unused ones wait in Redis (treasure_inc.items_id_pool) for the next generations
    id-block-size: 100
    # chance, in percent, that a generated item is an equipment (an item with stats, see Equipment)
    equipable-chance: 5
  characters:
    # how many characters a user starts with: the characters 1 to count of CharacterCatalog.
    # The others are recruited (see recruitment below)
    count: 3
    # how long the characters read from the database stay in Redis; no expiry while a change waits for the sync
    cache-ttl-seconds: 300
  recruitment:
    # price of one draw in a portal; the portals, their characters and the rates of the ranks are in CharacterCatalog
    cost: 1000
    # how many draws the "several draws at once" request makes
    multi: 10
  expeditions:
    # number of cases of a location's grid in the Unity client (SendExpeditionPanel.CreateGridLocation)
    grid-size: 18
    # highest number of floors (the slider of SendExpeditionPanel)
    max-difficulty: 10
    max-items: 15
    # cost of an expedition = floors * cost-per-floor * location level
    cost-per-floor: 100
    # experience of the character leading an expedition = floors * xp-per-floor * location level * (1 + rarity / 4);
    # the levels themselves are in Leveling
    xp-per-floor: 10
    # what may stand in the way on each floor (see ExpeditionRun); the chances are in percent
    obstacles:
      # how many spots of a floor may hold an obstacle
      spots: 2
      # chance that a spot holds a barricade (it only takes time), or a monster (it is fought)
      barricade-chance: 15
      monster-chance: 15
      # chance that the chest of a floor is kept by a monster, which drops it when it dies
      guardian-chance: 20
    # how long the dug cases of a location are remembered when no expedition is sent there
    dig-ttl: 24h
    # how long the unopened expeditions of a user are kept after the last one was sent
    ttl: 7d
    # adding a location: one line here (lowercase name) and a Location asset with this name in the Unity client
    locations:
      mordak: { level: 1 }
      gardakan: { level: 2 }
      bobafett: { level: 3 }
  quests:
    # how many quests of QuestCatalog are drawn for a player each day, and each week (from Monday)
    daily-count: 3
    weekly-count: 3
    # the time zone whose midnight starts a new day
    zone: Europe/Paris
    # how long the quests of a player are kept in Redis: longer than a week, so no board is lost while it lasts
    ttl: 8d
  sync:
    # how often the scheduler looks at the logged users
    check-interval: 30s
    # a user with pending changes is written to the database once its last sync is older than this
    max-age: 3m
    # a synchronized session idle for longer than this is removed from Redis (the next login reloads it)
    session-ttl: 1h
  locks:
    # safety expiry of a per-user lock (must exceed the longest critical section)
    ttl: 10s
    # how long a request waits for a user's lock before failing
    max-wait: 5s
quarkus:
  application:
    name: maestro
    version: 0.0.6
  http:
    port: 8091
    test-port: 8092
    test-timeout: 10s
  hibernate-orm:
    schema-management:
      strategy: none
    mapping:
      format:
        # the jsonb columns (items.stats, characters.equipment) use the JSON mapper of Hibernate,
        # not the one of the REST layer
        global: ignore
"%dev":
  quarkus:
    log:
      category:
        "org.bogomips":
          level: DEBUG
      console:
        json:
          enabled: false
    http:
      port: 8088
    datasource:
      devservices:
        enabled: false
      db-kind: postgresql
      username: treasure_inc
      password: ${DB_PASSWORD}
      reactive:
        url: vertx-reactive:postgresql://localhost:5432/treasure_inc
        max-size: 16
    redis:
      devservices:
        enabled: false
      hosts: redis://localhost:6379
      password: ${REDIS_PASSWORD}
"%test":
  quarkus:
    scheduler:
      enabled: false
    http:
      port: 8089
    datasource:
      devservices:
        enabled: false
      db-kind: postgresql
      reactive:
        url: postgresql://localhost:5432/test
    redis:
      devservices:
        enabled: false
      hosts: redis://localhost:6379
      password: ${REDIS_PASSWORD}
